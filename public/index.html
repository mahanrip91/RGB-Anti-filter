<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGB-Anti-filter</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0f14;color:#eef2f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#121821;border:1px solid #263140;border-radius:22px;padding:25px;box-shadow:0 20px 60px #0007}h1{margin:0 0 8px;font-size:28px}p{color:#9ca9b8;line-height:1.7}label{display:block;margin:18px 0 7px;font-weight:700}input{width:100%;padding:14px;border-radius:12px;border:1px solid #334052;background:#0b1017;color:#fff;font-size:15px;outline:none}input:focus{border-color:#6ea8fe}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#fff;color:#111;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.5}#result{display:none;margin-top:20px;padding:16px;border-radius:14px;background:#0b1118;border:1px solid #263140}a{color:#8ab4ff;word-break:break-all}.small{font-size:12px;color:#778392}</style></head><body><main class="card"><h1>RGB-Anti-filter</h1><p>نام کاربری و Cloudflare API Token را وارد کن. توکن فقط برای همان درخواست به backend فرستاده می‌شود و در GitHub ذخیره نمی‌شود.</p><label for="username">نام کاربری</label><input id="username" autocomplete="username" placeholder="مثلاً mahan"><label for="token">Cloudflare API Token</label><input id="token" type="password" autocomplete="off" placeholder="Cloudflare API Token"><button id="create">ساخت کانفیگ و لینک</button><div id="result"></div></main><script>const $=id=>document.getElementById(id);$("create").onclick=async()=>{const username=$("username").value.trim(),token=$("token").value.trim();if(!username||!token){$("result").style.display="block";$("result").innerHTML="<b>نام کاربری و توکن را وارد کن.</b>";return}$("create").disabled=true;$("create").textContent="در حال بررسی...";try{const r=await fetch("/api/create",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username,token})});const d=await r.json();$("result").style.display="block";if(!d.ok){$("result").innerHTML="<b>خطا:</b> "+esc(d.error||"Unknown error");return}$("result").innerHTML="<b>ساخته شد ✅</b><br><br>Username: "+esc(d.username)+"<br>Token: verified / "+esc(d.cloudflare_token.status)+"<br><br><b>Subscription:</b><br><a href='"+d.subscription_url+"' target='_blank'>"+d.subscription_url+"</a><br><br><b>Config API:</b><br><a href='"+d.config_url+"' target='_blank'>"+d.config_url+"</a><br><br><span class='small'>"+esc(d.note)+"</span>"}catch{$("result").style.display="block";$("result").innerHTML="<b>خطا در اتصال به سرور.</b>"}finally{$("create").disabled=false;$("create").textContent="ساخت کانفیگ و لینک"}};function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}</script></body></html>
